# Offline unit tests only — every test runs against the local mock NanoGPT
# harness. NEVER add live API calls (or secrets) to CI.
name: test

on: [push, pull_request]

jobs:
  # Only a tested version change on main creates a GitHub source release.
  qualify-github-source:
    name: Qualify GitHub source release
    if: github.event_name == 'pull_request' || (github.repository == 'nanoodlecom/nanoodle-py' && github.ref == 'refs/heads/main')
    needs: unittest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      version: ${{ steps.qualify.outputs.version }}
      prerelease: ${{ steps.qualify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Compare the built version with the prior main commit
        id: qualify
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python -m pip install --no-deps dist/*.whl
          python -I -c 'import nanoodle'
          python .github/scripts/publish_source.py qualify --package nanoodle >> "$GITHUB_OUTPUT"

  publish-github-source:
    name: Publish tested GitHub source release
    if: ${{ github.repository == 'nanoodlecom/nanoodle-py' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.qualify-github-source.outputs.version != '' }}
    needs: qualify-github-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-source-${{ needs.qualify-github-source.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Tag and release the tested source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERSION: ${{ needs.qualify-github-source.outputs.version }}
          SOURCE_PRERELEASE: ${{ needs.qualify-github-source.outputs.prerelease }}
        run: |
          python .github/scripts/publish_source.py publish --repository nanoodlecom/nanoodle-py \
            --version "$SOURCE_VERSION" --prerelease "$SOURCE_PRERELEASE"

  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -t . -v
